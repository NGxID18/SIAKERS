services:
  - type: web
    name: siakers-web
    env: php
    plan: free
    buildCommand: composer install --no-dev --optimize-autoloader
    startCommand: php artisan migrate --force && php artisan serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: "SIAKERS RSJKO Engku Haji Daud"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: base64:DywqJezUNOuozV8/YbIXbQ2fKbwMNrFmW1NvWmAp5Ug=
      - key: LOG_CHANNEL
        value: stderr
