version: '3.8'

services:
  mariadb:
    image: mariadb:latest
    container_name: siakers_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: siaker_db
      MYSQL_USER: siaker
      MYSQL_PASSWORD: siakerpass
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: siakers_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: secret
    ports:
      - "8081:80"
    depends_on:
      - mariadb

volumes:
  mariadb_data:
